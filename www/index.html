<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebICSP Programmer</title>
    <!-- CSS -->
    <link href="css/bootstrap-5.3.3.min.css" rel="stylesheet">
    <link href="css/web-icsp.css" rel="stylesheet">
    <!-- Chart.js (served from CDN for offline-optional use; swap to local if needed) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
    <!-- Main Page -->
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-6">
                <h2>WEB ICSP Programmer <div id="versionInfo"></div></h2>
                <button id="connect" class="btn btn-primary">Connect to Programmer</button>
                <button id="reset-target" class="btn btn-info">Reset Target</button>
                <div class="btn-group">
                    <button type="button" id="identify" class="btn btn-secondary">Identify Programmer</button>
                    <button type="button" id="settings" class="btn btn-secondary dropdown-toggle dropdown-toggle-split" 
                        data-bs-toggle="dropdown" aria-expanded="false">
                      <span class="visually-hidden">Toggle Dropdown</span>
                    </button>
                    <ul class="dropdown-menu">
                      <li class="dropdown-submenu dropend">
                        <a class="dropdown-item dropdown-toggle" href="#">Settings</a>
                        <ul class="dropdown-menu">
                            <li><span class="dropdown-item-text">Memory Areas</span></li>
                            <li>
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="program-space" checked>
                                    <label class="form-check-label" for="dropdownCheck">Program</label>
                                </div>
                            </li>
                            <li>
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="eeprom-space" checked>
                                    <label class="form-check-label" for="dropdownCheck">EEPROM</label>
                                </div>
                            </li>
                            <li>
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="userid-space" checked>
                                    <label class="form-check-label" for="dropdownCheck">UserId</label>
                                </div>
                            </li>
                            <li>
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="config-bits-space" checked>
                                    <label class="form-check-label" for="dropdownCheck">Config Bits</label>
                                </div>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="verify"  
                                        data-bs-toggle="tooltip" data-bs-title="Verify memory for errors after flashing." checked>
                                    <label class="form-check-label" for="dropdownCheck">Verify</label>
                                </div>
                            </li>
                            <li>
                                <!-- This line is kept out for this release. remove d-none to display it again -->
                                <div class="form-check d-none">
                                    <input type="checkbox" class="form-check-input" id="drag-and-flash" checked>
                                    <label class="form-check-label" for="dropdownCheck">Drag & Flash</label>
                                </div>
                            </li>
                        </ul>
                      </li>
                      <li></li>
                      <li><hr class="dropdown-divider"></li>
                      <!-- This line is kept out for this release. remove d-none to display it again -->
                      <li><button class="dropdown-item d-none" id="programit" class="btn btn-success mt-3">Programm Device</button></li>
                      <li><button class="dropdown-item" id="readit" class="btn btn-info mt-3">Read Device</button></li>
                      <li><button class="dropdown-item" id="showit" class="btn btn-info mt-3">Show Memory</button></li>              
                    </ul>
                  </div>
            </div>
            <div id="picInfo" class="col-md-6" block>
                <h2 id="picName">No device detected</h2>
                <button id="userId" class="btn btn-light" disabled>userId: 456</button>
            </div>
        </div>
        <div id="drop-area" class="border mt-3 p-5 text-center" disabled>
            <div>Drag and drop HEX file here</div>
            <div class="mt-3">
                <button id="browse-file" class="btn btn-secondary">Browse for HEX file</button>
                <input type="file" id="file-input" accept=".hex" style="display: none;">
            </div>
        </div>
        <div class="d-none">
            <h2 class="my-4">Available lessons:</h2>
            <div id="lessonsContainer"></div>
        </div>

        <!-- Serial Terminal Panel (hidden by default, toggled by the floating button) -->
        <div id="serial-terminal-panel" class="mt-3 mb-5 d-none" style="border:1px solid #dee2e6;border-radius:6px;overflow:hidden;">
            <!-- Panel header -->
            <div class="serial-terminal-header d-flex align-items-center justify-content-between px-3 py-2">
                <div class="d-flex align-items-center gap-2">
                    <span id="serial-status-dot" class="serial-status-dot serial-status-off"></span>
                    <strong>Serial Terminal</strong>
                    <span id="serial-status-txt" class="text-muted small ms-1">Disconnected</span>
                </div>
                <div class="d-flex align-items-center gap-2 flex-wrap">
                    <button id="serial-open-btn" class="btn btn-sm btn-success">Connect</button>
                    <button id="serial-play-stop" class="btn btn-sm btn-outline-secondary" title="Pause display" disabled>Pause</button>
                    <button id="serial-graph-mode" class="btn btn-sm btn-outline-secondary" title="Toggle CSV graph mode">&#128200; Graph</button>
                    <button id="serial-clear" class="btn btn-sm btn-outline-secondary" title="Clear terminal">&#10006;</button>
                </div>
            </div>
            <!-- Output + chart -->
            <div id="serial-text-area">
                <div id="serial-output" class="serial-output font-monospace small"></div>
            </div>
            <div id="serial-chart-area" class="d-none serial-chart-area">
                <canvas id="serial-chart-canvas"></canvas>
            </div>
            <!-- Input row -->
            <div class="serial-input-row d-flex gap-2 px-2 py-1">
                <input id="serial-input" type="text" class="form-control form-control-sm font-monospace"
                       placeholder="Type command and press Enter or Send…" disabled>
                <select id="serial-line-ending" class="form-select form-select-sm" title="Line ending" style="width:auto;min-width:85px">
                    <option value="\r\n" selected>CR+LF</option>
                    <option value="\n">LF</option>
                    <option value="\r">CR</option>
                    <option value="">None</option>
                </select>
                <button id="serial-send" class="btn btn-sm btn-primary" disabled>Send</button>
            </div>
        </div>
    </div>

    <!-- Floating toggle button above the footer -->
    <button id="serial-fab" class="btn btn-secondary serial-fab" title="Open Serial Terminal">
        Serial Terminal
    </button>
    <!-- Modal -->
    <div class="modal fade" id="dataModal" tabindex="-1" role="dialog" aria-labelledby="dataModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Title</h5>
                </div>
                <div class="modal-body" id="modalBody">Content</div>
                <div class="modal-footer">
                    <button type="button" id="closeModal" class="btn btn-secondary" data-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
    <div class="card fixed-bottom-card">
        <div class="card-header">
            Important weblinks
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-8">
                    <div>
                        <a class="card-link" href="https://try.microchip.com/training/logic-circuit-design-101">Logic Circuit Design 101</a>
                    </div>
                    <div>
                        <a class="card-link" href="https://www.microchip.com/en-us/products/microcontrollers-and-microprocessors/8-bit-mcus/core-independent-and-analog-peripherals/system-flexibility/configurable-logic-block">Configurable Logic Block</a>
                    </div>
                </div>
                <div class="col-md-4 text-end">
                    <div class="text-muted" style="font-size: 0.75rem;">
                        <div class="fw-bold mb-1">Authors</div>
                        <ul class="list-unstyled mb-0" style="font-size: 0.7rem;">
                            <li><a href="https://github.com/apshu" target="_blank" class="text-muted text-decoration-none">A. Kolinger</a></li>
                            <li><a href="https://github.com/edras" target="_blank" class="text-muted text-decoration-none">E. Pacola</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Scripts -->
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/bootstrap-5.3.3.min.js"></script>
    <script src="js/intel-hex.js"></script>
    <script src="js/pic/icsp_hid.js"></script>
    <script src="js/pic/pic.js"></script>
    <script src="lessons/lessons.js"></script>
    <script src="js/version.js"></script>
    <script src="js/serial_terminal.js"></script>
    <script src="js/web_icsp.js"></script>
</body>
</html>
